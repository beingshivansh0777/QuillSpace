server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is the important line for a React Router app: if a request
    # doesn't match a real file (e.g. /blog/123, /profile), fall back to
    # index.html instead of returning Nginx's default 404. React Router
    # then takes over and renders the correct page client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite fingerprints filenames
    # (e.g. index-a1b2c3.js), so a new deploy gets a new filename and
    # never serves a stale cached version by mistake.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}