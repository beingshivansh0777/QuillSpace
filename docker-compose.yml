services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  server:
    build: ./server
    ports:
      - "4000:3000"
    env_file:
      - ./server/.env
    environment:
      # Overrides whatever REDIS_URL might be in .env — inside Compose's
      # network, "redis" is the service name above, not localhost.
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        # These get baked into the compiled JS at build time — see the
        # note in client/Dockerfile about why this differs from the
        # backend's runtime env_file approach.
        VITE_BASE_URL: http://localhost:4000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped